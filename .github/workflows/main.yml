name: YouTube Auto Upload Bot

on:
  schedule:
    - cron: '0 12 * * *' # တစ်နေ့တစ်ကြိမ် (နေ့လည် ၁၂ နာရီ - UTC) မှာ run မယ်
    - cron: '0 23 * * *' # တစ်နေ့တစ်ကြိမ် (ည ၁၁ နာရီ - UTC) မှာ run မယ်
  workflow_dispatch: # လက်နဲ့ကိုယ်တိုင် run ချင်ရင်လည်း ရအောင်လုပ်ထားတာပါ

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install FFmpeg
      run: sudo apt-get update && sudo apt-get install -y ffmpeg

    - name: Install dependencies
      run: npm install

    - name: Run Bot
      env:
        YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
        YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        APP_ENV: PROD
      run: node index.js
